[project]
name = "recoup"
version = "0.3.0"
description = "Failed-payment recovery timing: cure-hazard model, schedule planner, off-policy evaluation."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[project.scripts]
recoup-ops = "recoup.ops:main"

[project.optional-dependencies]
test = ["pytest>=7", "httpx>=0.24"]
api = ["fastapi>=0.110", "uvicorn>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["recoup", "recoup.api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
