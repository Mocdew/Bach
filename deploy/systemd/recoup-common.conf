# Shared drop-in: install as
#   /etc/systemd/system/recoup-<name>.service.d/00-common.conf
# for retrain, plan and gate. Keeps the three services' identity, state
# layout and sandbox identical so a mismatch can't leak a model or a key.
[Service]
Slice=recoup.slice
DynamicUser=yes
# /var/lib/recoup   models/, gate/     (persistent, owned by the dynamic user)
# /var/log/recoup   run logs           (journald is primary; this is for the
#                                       per-run parquet audit of decisions)
# /run/recoup       lock + current-run scratch
StateDirectory=recoup
LogsDirectory=recoup
RuntimeDirectory=recoup
RuntimeDirectoryPreserve=yes
WorkingDirectory=/var/lib/recoup

# The Bachs key never lives in a unit file or the environment block.
# Encrypted with `systemd-creds encrypt --name=bachs_api_key`; the service
# reads it from $CREDENTIALS_DIRECTORY/bachs_api_key.
LoadCredentialEncrypted=bachs_api_key:/etc/recoup/bachs_api_key.cred
Environment=RECOUP_STATE=/var/lib/recoup
Environment=RECOUP_LOG=/var/log/recoup
Environment=PYTHONUNBUFFERED=1
Environment=OMP_NUM_THREADS=4
Environment=OPENBLAS_NUM_THREADS=4

# Sandbox. Nothing here needs more than outbound HTTPS to Bachs + its own
# state directory.
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=no
SystemCallFilter=@system-service
SystemCallFilter=~@privileged @resources
SystemCallArchitectures=native
CapabilityBoundingSet=
AmbientCapabilities=
UMask=0077
